<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Preferences</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg">

<div class="overlay">

    <div class="left">
        <h1>✈ FLYGLOBE</h1>
        <p>Plan your smart journey 🌍</p>
    </div>

    <div class="glass-card">

        <input type="text"
        id="source"
        placeholder="From">

        <input type="text"
        id="destination"
        placeholder="Destination">

        <input type="date"
        id="startDate">

        <input type="date"
        id="endDate">

        <input type="number"
        id="budget"
        placeholder="Budget">

        <input type="text"
        id="interests"
        placeholder="Food, sightseeing, routes">

        <button onclick="generatePlan()">
            Generate Plan
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

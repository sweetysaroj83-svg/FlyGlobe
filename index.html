<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FLYGLOBE Login</title>

<style>

body{

    margin:0;
    padding:0;

    font-family:Arial,sans-serif;

    background-image:url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");

    background-size:cover;
    background-position:center;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.main-container{

    width:100%;

    display:flex;

    justify-content:space-around;

    align-items:center;

    padding:40px;
}

.left-section{

    color:white;
}

.left-section h1{

    font-size:70px;

    margin-bottom:20px;
}

.left-section p{

    font-size:28px;
}

.login-box{

    width:350px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(10px);

    padding:40px;

    border-radius:20px;

    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.login-box h2{

    color:white;

    text-align:center;

    margin-bottom:30px;

    font-size:35px;
}

.login-box input{

    width:100%;

    padding:15px;

    margin-bottom:20px;

    border:none;

    border-radius:10px;

    font-size:16px;
}

.login-box button{

    width:100%;

    padding:15px;

    background:#ff7b54;

    color:white;

    border:none;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;
}

.login-box button:hover{

    background:#ff5722;
}

.signup-text{

    text-align:center;

    color:white;

    margin-top:20px;
}

.signup-text a{

    color:yellow;

    text-decoration:none;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="main-container">

    <!-- LEFT -->
    <div class="left-section">

        <h1>✈ FLYGLOBE</h1>

        <p>
        Discover places.
        Taste cultures.
        Travel smarter 🌍
        </p>

    </div>

    <!-- LOGIN -->
    <div class="login-box">

        <h2>Login</h2>

        <input
        type="email"
        id="username"
        placeholder="Enter Email">

        <input
        type="password"
        id="password"
        placeholder="Enter Password">

        <button onclick="login()">
        Login
        </button>

        <p class="signup-text">

            Don't have account?

            <a href="signup.html">
            Signup
            </a>

        </p>

    </div>

</div>

<!-- FIREBASE -->
<script type="module">

import "./firebase.js";

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Signup</title>

<style>

body{

    margin:0;
    padding:0;

    font-family:Arial,sans-serif;

    background-image:url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");

    background-size:cover;
    background-position:center;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.signup-box{

    width:350px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(10px);

    padding:40px;

    border-radius:20px;

    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.signup-box h1{

    color:white;

    text-align:center;

    margin-bottom:30px;
}

.signup-box input{

    width:100%;

    padding:15px;

    margin-bottom:20px;

    border:none;

    border-radius:10px;

    font-size:16px;
}

.signup-box button{

    width:100%;

    padding:15px;

    background:#ff7b54;

    color:white;

    border:none;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;
}

.signup-box button:hover{

    background:#ff5722;
}

.signup-box p{

    text-align:center;

    color:white;

    margin-top:20px;
}

.signup-box a{

    color:yellow;

    text-decoration:none;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="signup-box">

<h1>Create Account</h1>

<input
id="signupEmail"
type="email"
placeholder="Enter Email">

<input
id="signupPassword"
type="password"
placeholder="Enter Password">

<button onclick="signup()">
Signup
</button>

<p>

Already have account?

<a href="index.html">
Login
</a>

</p>

</div>

<!-- FIREBASE -->
<script type="module">

import "./firebase.js";

</script>

</body>

</html>
